<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employees - PayTrack</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Sidebar ===== -->
  <div class="sidebar">
    <h2>💼 PayTrack</h2>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="employees.html" class="active">👥 Employees</a>
    <a href="salary.html">💰 Salary</a>
    <a href="#" id="logoutBtn">🚪 Logout</a>
  </div>

  <!-- ===== Main content ===== -->
  <div class="main">
    <h1 class="page-title">Employees</h1>
    <p class="page-subtitle">Add new employees and see the full list</p>

    <!-- ===== Add employee form ===== -->
    <div class="box">
      <h3>Add New Employee</h3>

      <div class="form-grid">
        <div class="form-group">
          <label for="empName">Name</label>
          <input type="text" id="empName" placeholder="e.g. Ali">
        </div>

        <div class="form-group">
          <label for="empDepartment">Department</label>
          <select id="empDepartment">
            <option value="">Select department</option>
            <option value="HR">HR</option>
            <option value="IT">IT</option>
            <option value="Sales">Sales</option>
            <option value="Marketing">Marketing</option>
            <option value="Finance">Finance</option>
          </select>
        </div>

        <div class="form-group">
          <label for="empSalary">Salary (Rs)</label>
          <input type="number" id="empSalary" placeholder="e.g. 50000">
        </div>

        <div class="form-group">
          <label for="empCode">Login Code</label>
          <input type="text" id="empCode" placeholder="e.g. ali123">
        </div>
      </div>

      <button class="btn" id="addEmployeeBtn">Add Employee</button>
    </div>

    <!-- ===== Employee list ===== -->
    <div class="box">
      <h3>All Employees</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Department</th>
              <th>Salary</th>
              <th>Login Code</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="employeeTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ===== JavaScript ===== -->
  <script src="js/lib/sweetalert2.all.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/employees.js"></script>
</body>
</html>
